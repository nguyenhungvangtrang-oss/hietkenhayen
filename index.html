<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUVATRA - Thương Hiệu Yến Sào Đỉnh Cao & Giải Pháp Kỹ Thuật Nhà Yến</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #d4af37;
            --accent: #2d6a4f;
            --bg-light: #fdfbf7;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.7;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--white);
            padding: 3rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header p {
            font-size: 1.25rem;
            opacity: 0.95;
            font-weight: 300;
        }
        nav {
            background-color: var(--white);
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            padding: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 1.05rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: var(--secondary);
        }
        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }
        section {
            background: var(--white);
            margin-bottom: 2.5rem;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            border-top: 4px solid var(--secondary);
        }
        section h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 2rem;
            position: relative;
            padding-bottom: 0.5rem;
        }
        section h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 3px;
            background-color: var(--secondary);
        }
        .hero-banner {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            color: var(--white);
            border-radius: 12px;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .hero-banner h2 {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .hero-banner p {
            font-size: 1.35rem;
            max-width: 800px;
            margin: 0 auto;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 2.5rem;
            align-items: center;
        }
        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            header h1 { font-size: 2.2rem; }
            .hero-banner h2 { font-size: 2rem; }
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .card {
            background: var(--bg-light);
            padding: 2rem;
            border-radius: 10px;
            border-left: 5px solid var(--secondary);
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            transition: transform 0.3s;
        }
        .card:hover {
